<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital Aduanas - Jerez</title>
    <style>
       body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #091231;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            margin: 0;
            padding: 0px;
            padding-top: calc(env(safe-area-inset-top) + 15px);
            min-height: 100vh;
            box-sizing: border-box;
        }
        .tarjeta {
            width: 90vh;
            height: 90vh;
            background: #091321;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #d4af37;
        }
        .logo-container {
            width: 190px;
            height: 190px;
            margin-bottom: 10px;
            margin-top: 10px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .header-text {
            text-align: center;
            width: 100%;
            margin-bottom: 15px;
        }
        .titulo-aduanas {
            font-size: 37px;
            font-weight: 550;
            color: #ffffff;
            letter-spacing: 8px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            margin-top: 25px;
        }
        .titulo-mayus {
            font-size: 16px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 2px;
            margin: 0 0 0px 0;
            text-transform: uppercase;
            margin-top: 20px;
        }
        .titulo-detalle {
            font-size: 13px;
            color: #d4af37;
            font-weight: 600;
            margin: 0;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .separador-difuminado {
            width: 85%;
            height: 2px;
            background: linear-gradient(to right, rgba(212, 175, 55, 0) 0%, rgba(212, 175, 55, 1) 50%, rgba(212, 175, 55, 0) 100%);
            margin-bottom: 35px;
            margin-top: 10px;
        }
        .info-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3); /* Borde sutil dorado */
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        .info-box:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.8);
            transform: translateY(-2px);
        }
        .box-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #c5c3bc;
            margin-bottom: 5px;
            font-weight: bold;
            opacity: 0.9;
            text-align: center;
        }
        .box-content {
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            text-align: center;
        }
        .box-content.direccion {
            font-size: 14px;
            line-height: 1.4;
            color: #66b3ff;
        }
        .box-content.email {
           color: #66b3ff;
        }
    </style>
</head>
<body>

    <div class="tarjeta" id="tarjeta-digital">
        
        <div class="logo-container">
            <img class="logo-img" src="A164.png" alt="Escudo Aduanas">
        </div>

        <div class="header-text">
            <h1 class="titulo-aduanas">ADUANAS</h1>
            <p class="titulo-mayus">UNIDAD OPERATIVA</p>
            <p class="titulo-detalle">Jerez de la Frontera</p>
        </div>

        <div class="separador-difuminado"></div>

        <a href="tel:+34619022017" class="info-box">
            <span class="box-label">Teléfono de Contacto</span>
            <span class="box-content email">+34 619 02 20 17</span>
        </a>

        <a href="mailto:va.jerezdelafrontera@correo.aeat.es" class="info-box">
            <span class="box-label">Correo Electrónico</span>
            <span class="box-content email">va.jerezdelafrontera@correo.aeat.es</span>
        </a>

        <a href="https://maps.google.com/?q=Plaza+de+las+Marinas+1+Jerez+de+la+Frontera" target="_blank" class="info-box">
            <span class="box-label">Dirección</span>
            <span class="box-content direccion">
                Plaza de las Marinas, 1<br>
                11471 Jerez de la Frontera (Cádiz)
            </span>
        </a>
    </div>

</body>
</html>
